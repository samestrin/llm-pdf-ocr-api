name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint the workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Tests with 80% coverage gate
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file validates, with and without the vision profile
        run: |
          docker compose config -q
          docker compose --profile vision config -q
      - run: docker build -t llm-pdf-ocr-api:ci .
      - name: Start the container
        run: |
          docker run -d --name api -p 5000:5000 llm-pdf-ocr-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:5000/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Container runs as a non-root user and reports healthy
        run: |
          test "$(docker exec api id -u)" != "0"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && exit 0
            sleep 2
          done
          docker logs api; exit 1
      - name: Extract all three fixtures (born-digital, scanned via Tesseract, mixed)
        run: |
          post() { curl -fsS -F "file=@tests/fixtures/$1.pdf" -F format=markdown localhost:5000/v1/extract; }
          post born_digital | grep -q "Quarterly Report"
          post scanned | grep -qi "Scanned page text"
          post mixed | grep -qi "tesseract"
      - if: failure()
        run: docker logs api
