name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint the workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Install chromium for the browser tests
        run: uv run playwright install --with-deps chromium
      - name: Tests with 80% coverage gate
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file validates, with and without the vision profile
        run: |
          docker compose config -q
          docker compose --profile vision config -q
      - run: docker build -t llm-pdf-ocr-api:ci .
      - name: Start the container
        run: |
          docker run -d --name api -p 5000:5000 llm-pdf-ocr-api:ci
          for _ in $(seq 1 30); do curl -fsS localhost:5000/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Container runs as a non-root user and reports healthy
        run: |
          test "$(docker exec api id -u)" != "0"
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && exit 0
            sleep 2
          done
          docker logs api; exit 1
      - name: Extract all three fixtures (born-digital, scanned via Tesseract, mixed)
        run: |
          post() { curl -fsS -F "file=@tests/fixtures/$1.pdf" -F format=markdown localhost:5000/v1/extract; }
          post born_digital | grep -q "Quarterly Report"
          post scanned | grep -qi "Scanned page text"
          post mixed | grep -qi "tesseract"
      - name: Web page and its assets load with the network off and nothing configured
        run: |
          docker run -d --name offline --network none llm-pdf-ocr-api:ci
          docker exec -i offline python - <<'EOF'
          import re, time, urllib.request as u
          base = "http://127.0.0.1:5000"
          for _ in range(30):
              try:
                  page = u.urlopen(base + "/", timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("page did not load")
          assert page.headers["Content-Security-Policy"] == "default-src 'self'"
          html = page.read().decode()
          assets = re.findall(r'(?:src|href)="([^"]+)"', html)
          assert assets, html
          for asset in assets:
              assert u.urlopen(base + asset, timeout=2).status == 200, asset
          caps = u.urlopen(base + "/v1/capabilities", timeout=2).read().decode()
          assert '"vision"' not in caps, caps
          print("page and", len(assets), "assets loaded offline;", caps)
          EOF
      - if: failure()
        run: |
          docker logs api
          docker logs offline || true
