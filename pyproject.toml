[project]
name = "llm-pdf-ocr-api"
version = "0.0.1"
description = "Self-hosted service that turns PDFs, scanned or not, into clean text."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "jsonschema>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_pdf_ocr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=llm_pdf_ocr --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
